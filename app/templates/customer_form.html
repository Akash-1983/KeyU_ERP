<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Customer Master</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-8">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h4>

{% if customer %}

Edit Customer

{% else %}

Add Customer

{% endif %}

</h4>

</div>

<div class="card-body">

<form method="POST">

<div class="row">

<div class="col-md-6 mb-3">

<label>Company Name</label>

<input
type="text"
name="company_name"
class="form-control"
value="{{ customer.company_name if customer else '' }}"
required>

</div>

<div class="col-md-6 mb-3">

<label>Username</label>

<input
type="text"
name="username"
class="form-control"
value="{{ customer.username if customer else '' }}"
required>

</div>

<div class="col-md-6 mb-3">

<label>Password</label>

<input
type="text"
name="password"
class="form-control"
value="{{ customer.password if customer else '' }}"
required>

</div>

<div class="col-md-6 mb-3">

<label>Contact Person</label>

<input
type="text"
name="contact_person"
class="form-control"
value="{{ customer.contact_person if customer else '' }}">

</div>

<div class="col-md-6 mb-3">

<label>Mobile</label>

<input
type="text"
name="mobile"
class="form-control"
value="{{ customer.mobile if customer else '' }}">

</div>

<div class="col-md-6 mb-3">

<label>Email</label>

<input
type="email"
name="email"
class="form-control"
value="{{ customer.email if customer else '' }}">

</div>

<div class="col-md-12 mb-3">

<label>Address</label>

<textarea
name="address"
class="form-control"
rows="3">{{ customer.address if customer else '' }}</textarea>

</div>

</div>

<div class="text-end">

<a href="/customers"
class="btn btn-secondary">

Back

</a>

<button
class="btn btn-primary">

Save Customer

</button>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
