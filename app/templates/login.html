<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Govind Enterprises | Order Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="login-container">

    <div class="left-panel">

        <div>

            <h1>Govind Enterprises</h1>

            <h3>Order Management System</h3>

            <p class="mt-4">
                Complete Business Solution
            </p>

            <ul class="feature-list">

                <li><i class="fa-solid fa-circle-check"></i> Order Management</li>

                <li><i class="fa-solid fa-circle-check"></i> Inventory Management</li>

                <li><i class="fa-solid fa-circle-check"></i> Customer Management</li>

                <li><i class="fa-solid fa-circle-check"></i> Product Management</li>

                <li><i class="fa-solid fa-circle-check"></i> Reports & Analytics</li>

            </ul>

        </div>

    </div>

    <div class="right-panel">

        <div class="login-box">

            <div class="text-center mb-4">

                <i class="fa-solid fa-building fa-3x text-primary"></i>

                <h2 class="mt-3">Welcome Back</h2>

                <p>Please Login to Continue</p>

            </div>

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">Username</label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="fa-solid fa-user"></i>
                        </span>

                        <input
                                type="text"
                                class="form-control"
                                name="username"
                                placeholder="Enter Username"
                                required>

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">Password</label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="fa-solid fa-lock"></i>
                        </span>

                        <input
                                id="password"
                                type="password"
                                class="form-control"
                                name="password"
                                placeholder="Enter Password"
                                required>

                        <button
                                class="btn btn-outline-secondary"
                                type="button"
                                onclick="togglePassword()">

                            <i id="eye" class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>

                <div class="d-flex justify-content-between mb-4">

                    <div>

                        <input type="checkbox">

                        Remember Me

                    </div>

                    <a href="#">Forgot Password?</a>

                </div>

                <button class="btn btn-primary w-100 py-2">

                    Login

                </button>

            </form>

            <div class="text-center mt-4">

                <small>

                    © 2026 Govind Enterprises

                </small>

            </div>

        </div>

    </div>

</div>

<script>

function togglePassword(){

let password=document.getElementById("password");
let eye=document.getElementById("eye");

if(password.type==="password"){

password.type="text";
eye.className="fa-solid fa-eye-slash";

}
else{

password.type="password";
eye.className="fa-solid fa-eye";

}

}

</script>

</body>
</html>
